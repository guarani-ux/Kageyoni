name: Kageyoni v11 Situation Qualification
on:
  push:
    branches: [v11-situation-build]
  workflow_dispatch:
jobs:
  situation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Situation source
        run: python -m compileall -q kageyoni/situations tests
      - name: Run Situation tests
        run: python -m unittest discover -s tests -p 'test_situation*.py' -v
      - name: Run Situation mutation sensitivity
        run: python tools/situation_mutation_check.py
