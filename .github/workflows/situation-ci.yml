name: Situation CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [v11-situation-build]
  workflow_dispatch:
jobs:
  situation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Situation package
        run: python -m compileall -q kageyoni/situations tests/test_situation*.py
      - name: Run Situation tests
        run: python -m unittest discover -s tests -p 'test_situation*.py' -v
      - name: Run Situation mutation sensitivity
        run: python tools/situation_mutation_check.py
      - name: Run A-E mechanical comparison
        run: python tools/run_situation_comparative.py > situation-comparative.json
      - name: Require inherited engine for release qualification
        run: |
          test -f kageyoni/engine.py
          test -f kageyoni/v11/runtime.py
          test -f kageyoni/workspaces/pipeline.py
          test -f tests/test_v11.py
      - name: Run inherited and trust qualification
        run: |
          python -m unittest discover -s tests -p 'test_v11*.py' -v
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Package qualified integrated source
        run: zip -qr kageyoni-v11-candidate.zip kageyoni migrations tests tools docs
      - uses: actions/upload-artifact@v4
        with:
          name: kageyoni-v11-candidate
          path: kageyoni-v11-candidate.zip
          if-no-files-found: error
